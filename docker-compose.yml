services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: footy_backend
    ports:
      - "5001:5001"
    environment:
      - FOOTY_API_PORT=5001
      - FOOTY_API_DEBUG=False
    volumes:
      - ./backend/data:/app/data
      - ./backend/reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: footy_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
