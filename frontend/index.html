<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06101E" />
    <meta name="description" content="FOOTY - Advanced Football Analytics, League Simulation, Match Engine, and Predictive Scouting Platform." />
    <title>FOOTY - Smart Football Analytics & Simulation Platform</title>

    <!-- Preconnect & Asynchronous Font Loading for Maximum Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" />

    <style>
      /* Critical Initial Shell CSS to achieve instant sub-200ms FCP */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #06101E;
        color: #8FE3EC;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #06101E;
      }
      #root:empty::after {
        content: '';
        width: 42px;
        height: 42px;
        border: 3px solid rgba(143, 227, 236, 0.2);
        border-top-color: #F85525;
        border-radius: 50%;
        animation: footy-spin 0.8s linear infinite;
      }
      @keyframes footy-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
