server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend (optional, if you want nginx to handle CORS)
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy endpoints predate /api/v1. Keep their paths intact until clients
    # finish migrating to the versioned contract.
    location ~ ^/(teams|players|run-simulation|health|saves|load|matches|match|team-history|financial-summary|youth-prospects|transfer-activity|all-seasons-overview|get-seasons|get-season-report|get-transfer-reports|get-transfer-report|ml-reports|ml-models|run-ml-eval)(/|$) {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recordings/ {
        proxy_pass http://backend:5001;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
    }

    # Handling WebSockets
    location /ws {
        proxy_pass http://backend:5001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
